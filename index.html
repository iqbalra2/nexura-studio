<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexura Studio — Premium Organic Food</title>
<meta name="description" content="Nexura Studio-এর premium organic food experience.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">

<body>

<!-- Main application -->
<div id="app"></div>

<!-- =====================================================
     PREMIUM CART DRAWER
===================================================== -->
<div class="cart-overlay" id="cartOverlay"></div>

<aside class="cart-drawer" id="cartDrawer" aria-hidden="true">

  <div class="cart-header">
    <div>
      <span class="cart-eyebrow">YOUR BAG</span>
      <h2>আপনার কার্ট</h2>
    </div>

    <button class="cart-close" id="cartClose" aria-label="কার্ট বন্ধ করুন">
      ×
    </button>
  </div>

  <div class="cart-items" id="cartItems">
    <!-- JavaScript inserts cart items -->
  </div>

  <div class="cart-empty" id="cartEmpty">
    <div class="empty-icon">🛒</div>
    <h3>আপনার কার্ট খালি</h3>
    <p>পছন্দের পণ্য কার্টে যোগ করুন।</p>
  </div>

  <div class="cart-footer">

    <div class="cart-summary-row">
      <span>Subtotal</span>
      <strong id="cartSubtotal">৳0</strong>
    </div>

    <div class="cart-summary-row delivery-row">
      <span>Delivery</span>
      <strong id="cartDelivery">৳0</strong>
    </div>

    <div class="cart-total">
      <span>Total</span>
      <strong id="cartTotal">৳0</strong>
    </div>

    <button class="btn primary checkout-btn" id="checkoutBtn">
      Checkout →
    </button>

  </div>

</aside>


<!-- =====================================================
     ORDER MODAL
===================================================== -->
<div class="order-modal" id="orderModal">

  <div class="order-modal-card">

    <button class="modal-close" id="modalClose">×</button>

    <div class="modal-heading">
      <span>SECURE CHECKOUT</span>
      <h2>অর্ডার সম্পন্ন করুন</h2>
      <p>তথ্যগুলো পূরণ করুন। এরপর WhatsApp-এ অর্ডার পাঠানো হবে।</p>
    </div>

    <form id="orderForm" novalidate>

      <div class="form-field">
        <label for="custName">আপনার নাম *</label>

        <input
          type="text"
          id="custName"
          placeholder="পুরো নাম লিখুন"
          autocomplete="name"
        >

        <small class="field-error"></small>
      </div>

      <div class="form-field">
        <label for="custPhone">মোবাইল নম্বর *</label>

        <input
          type="tel"
          id="custPhone"
          placeholder="01XXXXXXXXX"
          inputmode="numeric"
          autocomplete="tel"
        >

        <small class="field-error"></small>
      </div>

      <div class="form-field">
        <label for="custAddress">সম্পূর্ণ ঠিকানা *</label>

        <textarea
          id="custAddress"
          rows="3"
          placeholder="জেলা, থানা ও বিস্তারিত ঠিকানা"
          autocomplete="street-address"
        ></textarea>

        <small class="field-error"></small>
      </div>

      <div class="form-field">
        <label for="paymentMethod">পেমেন্ট মেথড *</label>

        <select id="paymentMethod">
          <option value="ক্যাশ অন ডেলিভারি">
            ক্যাশ অন ডেলিভারি
          </option>

          <option value="বিকাশ">
            বিকাশ
          </option>

          <option value="নগদ">
            নগদ
          </option>
        </select>

        <small class="field-error"></small>
      </div>

      <div class="checkout-preview">

        <div>
          <span>Items</span>
          <strong id="checkoutItems">0</strong>
        </div>

        <div>
          <span>Delivery</span>
          <strong id="checkoutDelivery">৳0</strong>
        </div>

        <div class="preview-total">
          <span>Total</span>
          <strong id="checkoutTotal">৳0</strong>
        </div>

      </div>

      <button type="submit" class="btn primary submit-order">
        WhatsApp-এ অর্ডার পাঠান →
      </button>

    </form>

  </div>

</div>


<!-- =====================================================
     PREMIUM TOAST
===================================================== -->
<div class="premium-toast" id="premiumToast">

  <div class="toast-check">
    ✓
  </div>

  <div>
    <strong>অর্ডার প্রস্তুত!</strong>
    <span>WhatsApp-এ পাঠানো হচ্ছে...</span>
  </div>

</div>


<!-- =====================================================
     MOBILE STICKY CTA
===================================================== -->
<div class="mobile-order-bar">

  <div>
    <small>আপনার কার্ট</small>
    <strong id="mobileCartTotal">৳0</strong>
  </div>

  <button class="btn primary" id="mobileOrderBtn">
    Order Now →
  </button>

</div>


<script src="app.js"></script>

</body>
</html>
