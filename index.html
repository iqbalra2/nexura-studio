<link rel="stylesheet" href="styles.css">

<noscript><div class="noscript">এই ইন্টারেক্টিভ ওয়েবসাইটটি দেখতে জাভাস্ক্রিপ্ট প্রয়োজন।</div></noscript>

<div id="app"></div>

<!-- নতুন অর্ডার সেকশন শুরু -->
<section id="order-section">
  <h2>অর্ডার ফরম</h2>
  <form id="orderForm">
    <div>
      <label>আপনার নাম *</label>
      <input type="text" id="custName" required placeholder="পুরো নাম লিখুন">
    </div>
    
    <div>
      <label>মোবাইল নম্বর *</label>
      <input type="tel" id="custPhone" required placeholder="১১ ডিজিটের মোবাইল নম্বর">
    </div>

    <div>
      <label>সম্পূর্ণ ঠিকানা *</label>
      <textarea id="custAddress" required placeholder="জেলা, থানা ও বিস্তারিত ঠিকানা" rows="3"></textarea>
    </div>

    <div>
      <label>পেমেন্ট মেথড *</label>
      <select id="paymentMethod">
        <option value="ক্যাশ অন ডেলিভারি">ক্যাশ অন ডেলিভারি (Cash on Delivery)</option>
        <option value="বিকাশ">বিকাশ (bKash)</option>
        <option value="ন নগদ">নগদ (Nagad)</option>
      </select>
    </div>

    <button type="submit">অর্ডার কনফার্ম করুন</button>
  </form>
</section>
<!-- নতুন অর্ডার সেকশন শেষ -->

<script src="app.js"></script>
</body>
</html>
